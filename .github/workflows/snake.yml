name: Sakura contribution snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sakura-contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate the contribution animations
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#D45B91&color_dots=#FBEAF1,#F6C9D9,#EE9DBB,#DB6D9D,#AB3A74
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF9EC5&color_dots=#302331,#5C344F,#884266,#B65082,#E479A5

      - name: Publish the SVGs to the output branch
        shell: bash
        run: |
          output_ref=$(git ls-remote origin refs/heads/output)
          if [[ -n "$output_ref" ]]; then
            git fetch origin refs/heads/output
            git switch -c output FETCH_HEAD
          else
            git switch --orphan output
          fi

          mv dist/github-contribution-grid-snake*.svg .
          git add -- github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh Sakura contribution snake'
          git push origin HEAD:refs/heads/output
